<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>بطاقات ريفورج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e12;--panel:#14171d;--panel2:#1b1f27;--line:#262b35;--text:#eef0f4;--muted:#8b93a3;
  --amber:#f5a524;--teal:#3ccfa8;--violet:#9b83ff;--blue:#5aa8ff;--red:#ff6b6b;--green:#4ade80;--salla:#3ccfa8;--abdihqt:#9b83ff;
  --r:18px;
}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--panel:#fff;--panel2:#f1f0ec;--line:#e4e2dc;--text:#16181d;--muted:#6b7280;--amber:#c97d00;--teal:#0d9a78;--violet:#6d4fe0;--blue:#1f6fd1;--red:#d93c3c;--green:#15924a;--salla:#0d9a78;--abdihqt:#6d4fe0}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:16px/1.75 "IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
b{font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}
.en{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}

/* lock */
#lock{min-height:100dvh;display:grid;place-items:center;padding:16px}
.lockbox{width:100%;max-width:360px;text-align:center}
.lockbox .ico{font-size:40px;margin-bottom:8px}
.lockbox h1{font-size:22px;margin-bottom:4px}
.lockbox p{color:var(--muted);font-size:14px;margin-bottom:20px}
.lockbox input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;text-align:center;direction:ltr;outline:none}
.lockbox input:focus{border-color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;background:var(--amber);color:#16130a;font-weight:700;width:100%;margin-top:12px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.err{color:var(--red);font-size:14px;min-height:24px;margin-top:8px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.top .brand i{width:10px;height:10px;border-radius:3px;background:var(--amber);display:inline-block}
.iconbtn{padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px}

/* home */
.hero h1{font-size:26px;line-height:1.35;margin-bottom:4px}
.hero p{color:var(--muted);margin-bottom:22px}
.course{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;text-align:right;width:100%}
.course:hover{border-color:var(--muted)}
.course .by{font-size:13px;color:var(--muted)}
.course h2{font-size:19px;margin:2px 0}
.course .h2en{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.continue{margin-top:14px}

/* course */
.mod{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mod h3{font-size:16px}
.mod span{font-size:13px;color:var(--muted);direction:ltr}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.lesson:hover{border-color:var(--muted)}
.lesson .num{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);font-size:13px;font-weight:700;direction:ltr}
.lesson.done .num{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.lesson .tx{flex:1;min-width:0}
.lesson .tx b{display:block;font-size:15px;font-weight:600;line-height:1.45}
.lesson .tx small{display:block;color:var(--muted);font-size:12.5px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .st{flex:none;font-size:12px;color:var(--muted)}
.lesson.done .st{color:var(--green)}

/* deck */
.deckhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.deckhead .ttl{flex:1;min-width:0}
.deckhead .ttl b{display:block;font-size:15px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deckhead .ttl small{color:var(--muted);font-size:12px}
.segs{display:flex;gap:4px;margin-bottom:16px}
.segs i{flex:1;height:4px;border-radius:4px;background:var(--panel2);transition:background .25s}
.segs i.on{background:var(--c,var(--amber))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:52vh;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);margin-bottom:14px}
.card h2{font-size:22px;line-height:1.45;margin-bottom:10px}
.card.idea h2{font-size:26px}
.card p{margin-bottom:10px}
.card ul{padding-inline-start:20px;margin-bottom:10px}
.card li{margin-bottom:4px}
.formula{direction:rtl;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-weight:600;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
table.t th{color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.navbar{position:fixed;inset:auto 0 0 0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.navbar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{margin:0}
.navbar .ghost{flex:0 0 34%}

/* sims */
.sim .ctx{background:var(--panel2);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-bottom:14px}
.sim .q{font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:right;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;line-height:1.55}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.opt.dim{opacity:.55}
.tag{font-size:12px;color:var(--muted);margin-top:10px}

/* figure */
.figt{direction:ltr;text-align:right;font-weight:700;font-size:15px}
.figar{font-size:14px;color:var(--muted);margin-bottom:12px}
.figbox{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:6px;overflow:hidden}
.figbox img{display:block;width:100%;height:auto;border-radius:8px;background:#fff}
.redraw{font-size:12px;color:var(--muted);margin-bottom:14px}
.redraw .en{white-space:nowrap}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.terms{display:grid;gap:6px}
.terms div{display:flex;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:5px;font-size:14px}
.terms .e{direction:ltr;font-weight:600;flex:none;max-width:55%}
.terms .a{text-align:left;color:var(--text)}
.ref{font-size:13px;color:var(--muted);margin-top:12px}
.ref .en{color:var(--text)}
/* diagrams */
svg text{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;direction:ltr;justify-content:flex-start;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.hbars{display:grid;gap:9px;position:relative}
.hbars .r{display:grid;grid-template-columns:minmax(80px,38%) 1fr;gap:10px;align-items:center;font-size:13px}
.hbars .l{direction:ltr;text-align:left}
.hbars .tr{position:relative;height:22px;background:var(--panel);border-radius:6px;direction:ltr}
.hbars .f{height:100%;border-radius:6px;background:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-size:12px;font-weight:700;color:var(--bg)}
.hbars .f.hl{background:var(--teal)}
.hbars .ln{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--amber)}
.hbars .ln b{position:absolute;top:-18px;left:-14px;font-size:11px;color:var(--amber)}
.cyc{display:grid;gap:6px;justify-items:center}
.cyc .center{font-weight:700;border:2px dashed var(--amber);border-radius:999px;padding:6px 14px;font-size:13.5px;margin-bottom:6px}
.cyc .s{width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px}
.cyc .s.hl{border-color:var(--red);color:var(--red)}
.cyc .ar{color:var(--muted);font-size:14px;line-height:1}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-start;direction:ltr}
.flow .s{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;text-align:center}
.flow .s.hl{border-color:var(--teal);color:var(--teal);font-weight:700}
.flow .ar{color:var(--muted)}
.tree .root{text-align:center;font-weight:700;background:var(--panel);border:1px solid var(--amber);border-radius:12px;padding:8px;margin-bottom:10px;direction:ltr}
.tree .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tree .g h4{font-size:13px;text-align:center;margin-bottom:6px;color:var(--muted)}
.tree .it{direction:ltr;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:5px;text-align:center}
.tree .it.hl{border-color:var(--red);color:var(--red);font-weight:700}
.grid8{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid8 div{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:13px}
.grid8 div b{display:block;font-size:13px}
.grid8 div.hl{border-color:var(--teal)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .c{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.split .c.hl{border-color:var(--amber)}
.split h4{font-size:13px;margin-bottom:6px}
.split li{font-size:13px;margin-bottom:3px}
.split ul{padding-inline-start:16px}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;direction:ltr}
.nps div{text-align:center;padding:8px 0;border-radius:6px;font-weight:700;font-size:13px;color:#111}
.npsl{display:grid;grid-template-columns:7fr 2fr 2fr;gap:3px;direction:ltr;font-size:11.5px;text-align:center;margin-top:5px;color:var(--muted)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.tl div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px}
.tl div b{display:block;color:var(--teal);font-size:13px}
@media (min-width:640px){.card{padding:28px 30px}}
</style>
</head>

const $app = document.getElementById('app');
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
// tiny markdown: paragraphs split by blank line, "- " lines become a list
const md = s => !s ? '' : s.split(/\n\n+/).map(block => {
  const lines = block.split('\n');
  if (lines.every(l => l.startsWith('- '))) return '<ul>' + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
  return `<p>${inline(block)}</p>`;
}).join('');

/* ---------- unlock ---------- */
let DATA = null;
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  return JSON.parse(dec.decode(pt));
}
async function tryRemembered() {
  const raw = store.get('rf.key');
  if (!raw) return false;
  try {
    const key = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
    DATA = await open(key);
    return true;
  } catch { store.del('rf.key'); return false }
}
function lockScreen() {
  $app.innerHTML = `<div id="lock"><form class="lockbox" id="lf">
    <div class="ico">🔒</div><h1>بطاقات ريفورج</h1><p>مساحة خاصة. أدخل كلمة المرور.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" autofocus>
    <button class="btn" type="submit">ادخل</button><div class="err" id="er"></div></form></div>`;
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const er = document.getElementById('er'); er.textContent = '...';
    try {
      const key = await deriveKey(document.getElementById('pw').value);
      DATA = await open(key);
      store.set('rf.key', toB64(await crypto.subtle.exportKey('raw', key)));
      start();
    } catch { er.textContent = 'كلمة المرور غلط' }
  };
}

/* ---------- progress: localStorage + cookie, merged, never cleared ---------- */
const PK = 'rf.progress.v1';
function readCookie() {
  const m = document.cookie.match(new RegExp('(?:^|; )' + PK.replace(/\./g, '\\.') + '=([^;]*)'));
  try { return m ? JSON.parse(decodeURIComponent(m[1])) : {} } catch { return {} }
}
function loadProgress() {
  let ls = {};
  try { ls = JSON.parse(store.get(PK) || '{}') } catch {}
  const ck = readCookie();
  const done = { ...(ck.done || {}), ...(ls.done || {}) };
  return { done, last: ls.last || ck.last || null };
}
let prog = loadProgress();
function saveProgress() {
  const s = JSON.stringify(prog);
  store.set(PK, s);
  document.cookie = `${PK}=${encodeURIComponent(s)};max-age=315360000;path=/;SameSite=Lax`;
}
function markDone(cid, lid) {
  const k = cid + '/' + lid;
  if (!prog.done[k]) { prog.done[k] = Date.now(); saveProgress() }
}
const isDone = (cid, lid) => !!prog.done[cid + '/' + lid];

/* ---------- data helpers ---------- */
const course = id => DATA.courses.find(c => c.id === id);
const flat = c => c.modules.flatMap(m => m.lessons);
const lessonOf = (c, lid) => flat(c).find(l => l.id === lid);
const pct = c => { const ls = flat(c); return Math.round(100 * ls.filter(l => isDone(c.id, l.id)).length / ls.length) };
const nextUndone = c => flat(c).find(l => !isDone(c.id, l.id));
const nextLesson = (c, lid) => { const ls = flat(c); return ls[ls.findIndex(l => l.id === lid) + 1] };

/* ---------- routing: leaving a lesson marks it complete ---------- */
let current = null; // {cid,lid}
function parse() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'c' && p[1]) return { v: 'course', cid: p[1] };
  if (p[0] === 'l' && p[1] && p[2]) return { v: 'lesson', cid: p[1], lid: decodeURIComponent(p[2]) };
  return { v: 'home' };
}
function route() {
  const r = parse();
  if (current && !(r.v === 'lesson' && r.cid === current.cid && r.lid === current.lid)) markDone(current.cid, current.lid);
  current = null;
  window.scrollTo(0, 0);
  if (r.v === 'course' && course(r.cid)) return viewCourse(course(r.cid));
  if (r.v === 'lesson' && course(r.cid) && lessonOf(course(r.cid), r.lid)) return viewLesson(course(r.cid), r.lid);
  viewHome();
}
const go = h => { location.hash = h };

function topbar(back) {
  return `<div class="top">${back ? `<button class="iconbtn" onclick="go('${back}')">→ رجوع</button>` : `<div class="brand"><i></i>بطاقات ريفورج</div>`}
    <button class="iconbtn" onclick="lockNow()" title="قفل">🔒</button></div>`;
}
function lockNow() { store.del('rf.key'); DATA = null; history.replaceState(null, '', location.pathname); lockScreen() }

function viewHome() {
  const total = DATA.courses.reduce((n, c) => n + flat(c).length, 0);
  const done = DATA.courses.reduce((n, c) => n + flat(c).filter(l => isDone(c.id, l.id)).length, 0);
  let cont = '';
  if (prog.last) {
    const [cid, lid] = prog.last.split('/'); const c = course(cid);
    const l = c && (isDone(cid, lid) ? (nextLesson(c, lid) || nextUndone(c)) : lessonOf(c, lid));
    if (l) cont = `<button class="btn continue" onclick="go('#/l/${cid}/${encodeURIComponent(l.id)}')">كمّل: ${esc(l.id)} ${esc(l.title)}</button>`;
  }
  $app.innerHTML = `<div class="wrap">${topbar()}
    <div class="hero"><h1>كل درس أقل من دقيقتين.</h1><p>${done} من ${total} درس مكتمل · ${DATA.courses.length} كورس</p></div>
    ${DATA.courses.map(c => { const n = flat(c).length, d = flat(c).filter(l => isDone(c.id, l.id)).length; return `
      <button class="course" onclick="go('#/c/${c.id}')">
        <div class="by en" style="text-align:right">${esc(c.by)}</div><h2>${esc(c.titleAr)}</h2><div class="h2en">${esc(c.title)}</div>
        <div class="bar"><i style="width:${pct(c)}%"></i></div><div class="meta"><span>${d} من ${n} درس</span><span>${pct(c)}%</span></div>
      </button>`}).join('')}
    ${cont}</div>`;
}

function viewCourse(c) {
  const nx = nextUndone(c);
  $app.innerHTML = `<div class="wrap">${topbar('#/')}
    <div class="hero"><div class="muted en" style="text-align:right;font-size:13px">${esc(c.by)}</div><h1>${esc(c.titleAr)}</h1><p class="en" style="text-align:right">${esc(c.title)}</p>
    <div class="bar"><i style="width:${pct(c)}%"></i></div><div class="meta"><span>${flat(c).filter(l => isDone(c.id, l.id)).length} من ${flat(c).length} درس</span><span>${pct(c)}%</span></div>
    ${nx ? `<button class="btn continue" onclick="go('#/l/${c.id}/${encodeURIComponent(nx.id)}')">${pct(c) ? 'كمّل' : 'ابدأ'}: ${esc(nx.title)}</button>` : ''}</div>
    ${c.modules.map(m => `<div class="mod"><h3>${esc(m.titleAr)}</h3><span>${esc(m.title)}</span></div>
      ${m.lessons.map(l => { const d = isDone(c.id, l.id); return `<button class="lesson ${d ? 'done' : ''}" onclick="go('#/l/${c.id}/${encodeURIComponent(l.id)}')">
        <span class="num">${d ? '✓' : esc(l.id === 'plan' ? '★' : l.id)}</span>
        <span class="tx"><b>${esc(l.title)}</b><small>${esc(l.en)}</small></span>
        <span class="st">${d ? 'مكتمل' : l.cards.length + ' بطاقات'}</span></button>` }).join('')}`).join('')}
  </div>`;
}

/* ---------- lesson deck ---------- */
const TYPES = {
  idea: ['💡 الفكرة', 'var(--amber)'], story: ['📖 القصة', 'var(--violet)'], concept: ['🧩 الإطار', 'var(--blue)'],
  fig: ['🖼️ صورة ريفورج', 'var(--teal)'], salla: ['🛒 محاكاة: سلة', 'var(--salla)'], abdihqt: ['🎓 محاكاة: أبدع', 'var(--abdihqt)'], recap: ['✅ الخلاصة', 'var(--green)']
};
let deck = null;
function viewLesson(c, lid) {
  current = { cid: c.id, lid };
  prog.last = c.id + '/' + lid; saveProgress();
  deck = { c, l: lessonOf(c, lid), i: 0 };
  drawDeck();
}
function drawDeck() {
  const { c, l, i } = deck, card = l.cards[i], [label, col] = TYPES[card.t], last = i === l.cards.length - 1;
  if (last) markDone(c.id, l.id);
  const nx = nextLesson(c, l.id);
  $app.innerHTML = `<div class="wrap" style="--c:${col}">
    <div class="deckhead"><button class="iconbtn" onclick="go('#/c/${c.id}')">→</button>
      <div class="ttl"><b>${esc(l.id === 'plan' ? '' : l.id + ' · ')}${esc(l.title)}</b><small dir="ltr">${i + 1} / ${l.cards.length}</small></div></div>
    <div class="segs">${l.cards.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
    <article class="card ${card.t}" id="card"><span class="chip">${label}</span>${renderCard(card)}</article>
  </div>
  <div class="navbar"><div class="in">
    <button class="btn ghost" onclick="step(-1)" ${i ? '' : 'disabled style="opacity:.4"'}>السابق</button>
    ${last ? (nx ? `<button class="btn" onclick="go('#/l/${c.id}/${encodeURIComponent(nx.id)}')">الدرس التالي ←</button>` : `<button class="btn" onclick="go('#/c/${c.id}')">خلصت الكورس 🎉</button>`)
           : `<button class="btn" onclick="step(1)">التالي ←</button>`}
  </div></div>`;
  wireSims();
}
function step(d) {
  const n = deck.i + d;
  if (n < 0 || n >= deck.l.cards.length) return;
  deck.i = n; drawDeck(); window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (!deck || !current || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') step(1);
  if (e.key === 'ArrowRight') step(-1);
});
let tx = null, ty = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null || !current) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx > 0 ? 1 : -1); // RTL: swipe right = forward
}, { passive: true });

function renderCard(k) {
  switch (k.t) {
    case 'idea': case 'story':
      return `<h2>${inline(k.h)}</h2>${md(k.b)}`;
    case 'concept':
      return `<h2>${inline(k.h)}</h2>${(k.formula || []).map(f => `<div class="formula">${inline(f)}</div>`).join('')}${k.table ? table(k.table) : ''}${md(k.b)}`;
    case 'fig': return renderFig(k.fig);
    case 'salla': case 'abdihqt':
      return `<div class="sim"><h2>${inline(k.h)}</h2><div class="ctx">${inline(k.b)}</div><div class="q">${inline(k.q)}</div>
        ${k.opts.map((o, j) => `<button class="opt" data-j="${j}" data-ok="${o.ok ? 1 : 0}">${inline(o.x)}<span class="why" hidden>${inline(o.why)}</span></button>`).join('')}
        <div class="tag">${k.t === 'salla' ? 'سيناريو تمرين من شغلك في الاكتساب وصفحات الموقع. الأرقام افتراضية.' : 'سيناريو تمرين على study.abdihqt.com. الأرقام افتراضية إلا اللي في ملاحظاتك.'}</div></div>`;
    case 'recap':
      return `<h2>خلّها في راسك</h2><ul>${k.items.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`;
  }
  return '';
}
const table = t => `<table class="t"><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(x => `<td>${inline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function wireSims() {
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const all = b.parentElement.querySelectorAll('.opt');
    all.forEach(o => { o.disabled = true; o.querySelector('.why').hidden = false; o.classList.add(o.dataset.ok === '1' ? 'ok' : (o === b ? 'no' : 'dim')) });
  });
}

/* ---------- figures: real Reforge image if embedded, otherwise a redraw ---------- */
function renderFig(f) {
  const img = DATA.images[f.id];
  return `<div class="figt">${esc(f.en)}</div><div class="figar">${esc(f.ar)}</div>
    <div class="figbox">${img ? `<img src="${img}" alt="${esc(f.en)}">` : diagram(f)}</div>
    <div class="redraw">${img ? 'الصورة الأصلية من ريفورج.' : `إعادة رسم توضيحية. ضع صورة ريفورج باسم <span class="en">${esc(f.id)}.png</span> في مجلد figures وتظهر هنا.`}</div>
    <div class="sec">ترجمة عناصر الصورة</div>
    <div class="terms">${f.terms.map(([e, a]) => `<div><span class="e">${esc(e)}</span><span class="a">${esc(a)}</span></div>`).join('')}</div>
    <div class="sec">الشرح</div><ul>${f.explain.map(x => `<li>${inline(x)}</li>`).join('')}</ul>
    <div class="ref">📍 الدرس في ريفورج: <span class="en">${esc(f.ref)}</span></div>`;
}
function diagram(f) {
  const d = f.data;
  switch (f.kind) {
    case 'lines': return svgLines(d);
    case 'bars': return `<div class="hbars">${d.items.map(it => `<div class="r"><span class="l">${esc(it.l)}</span><span class="tr"><span class="f ${it.hl ? 'hl' : ''}" style="width:${100 * it.v / d.max}%">${it.v}${d.unit}</span>${d.line ? `<span class="ln" style="left:${100 * d.line / d.max}%"></span>` : ''}</span></div>`).join('')}</div>${d.line ? `<div class="legend"><span><i style="background:var(--amber)"></i>${esc(d.lineL)}</span></div>` : ''}`;
    case 'cycle': return `<div class="cyc">${d.center ? `<div class="center en">${esc(d.center)}</div>` : ''}${d.steps.map((s, i) => `<div class="s ${d.hl === i ? 'hl' : ''}">${i + 1}. ${esc(s)}</div><div class="ar">${i < d.steps.length - 1 ? '↓' : '↻ ترجع للبداية'}</div>`).join('')}</div>`;
    case 'flow': return `<div class="flow">${d.steps.map((s, i) => `<span class="s ${d.hl === i ? 'hl' : ''}">${esc(s)}</span>${i < d.steps.length - 1 ? '<span class="ar">→</span>' : ''}`).join('')}</div>`;
    case 'tree': return `<div class="tree"><div class="root">${esc(d.root)}</div><div class="cols">${d.groups.map(g => `<div class="g"><h4>${esc(g.h)}</h4>${g.items.map(x => `<div class="it ${x === d.hl ? 'hl' : ''}">${esc(x)}</div>`).join('')}</div>`).join('')}</div></div>`;
    case 'grid': return `<div class="grid8">${d.items.map(x => `<div class="${x.hl ? 'hl' : ''}"><b>${esc(x.h)}</b><span class="muted">${esc(x.s)}</span></div>`).join('')}</div>`;
    case 'split': return `<div class="split">${d.cols.map(c => `<div class="c ${c.hl ? 'hl' : ''}"><h4>${esc(c.h)}</h4><ul>${c.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    case 'scale': return `<div class="nps">${[...Array(11)].map((_, n) => `<div style="background:${n <= 6 ? 'var(--red)' : n <= 8 ? '#d6d3c9' : 'var(--green)'}">${n}</div>`).join('')}</div><div class="npsl"><span>Detractors · منتقدين</span><span>Passives</span><span>Promoters</span></div>`;
    case 'timeline': return `<div class="tl">${d.steps.map(s => `<div><b>${esc(s.d)}</b>${esc(s.s)}</div>`).join('')}</div>`;
    case 'scatter': return svgScatter(d);
  }
  return '';
}
function svgLines(d) {
  const W = 340, H = 200, L = 36, R = 12, T = 14, B = 30, n = d.x.length;
  const X = i => L + (W - L - R) * i / (n - 1), Y = v => T + (H - T - B) * (1 - (v - d.min) / (d.max - d.min));
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = d.min + (d.max - d.min) * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${Math.round(v)}${d.unit}</text>` }
  if (d.zero) g += `<rect x="${L}" y="${Y(0)}" width="${W - L - R}" height="${Y(d.min) - Y(0)}" fill="var(--red)" opacity=".08"/><line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  d.x.forEach((x, i) => g += `<text x="${X(i)}" y="${H - 12}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(x)}</text>`);
  (d.marks || []).forEach(m => g += `<line x1="${X(m.i)}" x2="${X(m.i)}" y1="${T}" y2="${H - B}" stroke="var(--amber)" stroke-dasharray="3 3"/><text x="${X(m.i)}" y="${T + 9}" font-size="10" font-weight="700" fill="var(--amber)" text-anchor="middle">${esc(m.l)}</text>`);
  d.series.forEach(s => g += `<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''} points="${s.pts.map((v, i) => X(i) + ',' + Y(v)).join(' ')}"/>`);
  if (d.xl) g += `<text x="${(L + W - R) / 2}" y="${H}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(d.xl)}</text>`;
  return `<div dir="ltr"><svg viewBox="0 0 ${W} ${H + 4}" width="100%" role="img">${g}</svg><div class="legend">${d.series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;
}
function svgScatter(d) {
  const W = 340, H = 220, L = 34, R = 14, T = 12, B = 34;
  const X = v => L + (W - L - R) * v / 100, Y = v => T + (H - T - B) * (1 - v / 100);
  let g = `<rect x="${X(0)}" y="${Y(100)}" width="${X(d.zone.x) - X(0)}" height="${Y(d.zone.y) - Y(100)}" fill="var(--teal)" opacity=".09"/>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${L}" x2="${L}" y1="${T}" y2="${Y(0)}" stroke="var(--line)"/>`;
  d.pts.forEach(p => g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${p.hl ? 'var(--teal)' : 'var(--muted)'}"/><text x="${X(p.x) + (p.x > 75 ? -8 : 8)}" y="${Y(p.y) + 4}" font-size="10.5" fill="var(--text)" text-anchor="${p.x > 75 ? 'end' : 'start'}">${esc(p.l)}</text>`);
  g += `<text x="${(L + W - R) / 2}" y="${H - 8}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(d.xl)} →</text><text x="12" y="${(T + H - B) / 2}" font-size="10" fill="var(--muted)" text-anchor="middle" transform="rotate(-90 12 ${(T + H - B) / 2})">${esc(d.yl)} →</text>`;
  return `<div dir="ltr"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg></div>`;
}

/* ---------- boot ---------- */
function start() { window.onhashchange = route; route() }
// a page close while inside a lesson also counts as leaving it
addEventListener('pagehide', () => { if (current) markDone(current.cid, current.lid) });
tryRemembered().then(ok => ok ? start() : lockScreen());
</script>
