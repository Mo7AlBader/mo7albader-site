<style>
/* Layout: one screen. Total on top, a lit desk scene in the free band, two model readouts at the bottom. mo7albader identity: black, orange, mint, Rajdhani numerals, framed column. */
:root{
  --bg:#000; --surface:#111; --accent:#f3500f; --accent-2:#ff6a2b; --mint:#1ef482;
  --fg:#fff; --muted:rgba(255,255,255,.6); --faint:#666; --line:rgba(255,255,255,.1);
  --glass:inset 0 1px 10px rgba(255,255,255,.1);
  --display:"Rajdhani",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sig:"Waterfall",cursive;
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(16px,4vw,32px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--ar);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

#stars,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#stars{z-index:0}
#gl{z-index:1;touch-action:pan-y}
.rules{position:fixed;inset:0;z-index:2;pointer-events:none;max-width:850px;margin-inline:auto;box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line)}
.rules::before,.rules::after{content:"";position:absolute;top:calc(76px + env(safe-area-inset-top,0px));width:6px;height:6px;background:var(--faint)}
.rules::before{left:-3px}.rules::after{right:-3px}
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.7) 0,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 66%,rgba(0,0,0,.75) 100%)}

.ui{position:relative;z-index:3;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;max-width:1180px;margin-inline:auto;padding-inline:var(--gut);pointer-events:none}
.ui a,.ui button{pointer-events:auto}

.bar{display:flex;align-items:center;justify-content:space-between;height:calc(76px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.sig{font-family:var(--sig);font-size:40px;line-height:1;color:var(--fg);text-decoration:none;direction:ltr;padding-top:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.pill i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--mint);animation:ping 2.4s var(--ease) infinite}

.total{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-top:clamp(8px,3vh,36px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.num{display:inline-flex;direction:ltr;font-family:var(--display);font-weight:700;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.num.big{font-size:clamp(40px,12.4vw,124px);text-shadow:0 6px 60px rgba(0,0,0,.65)}
.split{display:flex;direction:ltr;width:min(100%,460px);height:3px;border-radius:3px;background:var(--line);overflow:hidden;gap:3px}
.split i{display:block;height:100%;width:0;border-radius:3px;transition:width 2s var(--ease) .6s}
.split .c{background:var(--accent)}
.split .g{background:var(--mint)}

.fill{flex:1;min-height:200px}

.models{display:flex;justify-content:space-between;gap:16px;direction:ltr;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.model{appearance:none;font:inherit;color:inherit;margin:0;cursor:pointer;width:min(340px,44%);padding:18px 22px 20px;border-radius:24px;background:rgba(17,17,17,.55);border:1px solid var(--line);box-shadow:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .5s,box-shadow .5s,opacity .5s,transform .5s var(--ease)}
.model.claude{--c:var(--accent);text-align:left;direction:ltr}
.model.gpt{--c:var(--mint);text-align:right;direction:rtl}
.lab{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);direction:ltr}
.model.gpt .lab{flex-direction:row-reverse}
.lab i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.lab em{font-style:normal;font-family:var(--display);font-weight:600;font-size:15px;color:var(--c);margin-left:auto}
.model.gpt .lab em{margin-left:0;margin-right:auto}
.model .num{font-size:clamp(28px,3vw,42px);font-weight:600;margin-top:12px}
.model.on{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:var(--glass),0 24px 70px -30px var(--c);transform:translateY(-3px)}
.ui[data-focus="claude"] .model.gpt,.ui[data-focus="gpt"] .model.claude{opacity:.4}

.ch{display:inline-block;width:.54em;height:1em;overflow:hidden;text-align:center}
.ch.sep{width:.22em}
.reel{display:flex;flex-direction:column;transition:transform 1.2s var(--ease);will-change:transform}
.reel span{display:block;height:1em;line-height:1}
.tail{opacity:.38}

.rise{animation:rise 1s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(2.6);opacity:0}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:760px){
  .rules{display:none}
  .sig{font-size:34px}
  .pill{font-size:13px;padding:5px 12px}
  .total{gap:12px}
  .split{width:min(100%,280px)}
  .fill{min-height:240px}
  .models{flex-direction:column;gap:0;direction:rtl;padding:2px 18px;margin-bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:22px;background:rgba(17,17,17,.6);border:1px solid var(--line);box-shadow:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .model,.model.claude,.model.gpt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border:0;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;direction:rtl;text-align:right;transform:none}
  .model+.model{border-top:1px solid var(--line)}
  .model.gpt .lab,.model.claude .lab{flex-direction:row-reverse;direction:ltr}
  .lab em{display:none}
  .model .num{font-size:24px;margin:0}
  .model.on{box-shadow:none;transform:none}
  .model.on .lab{color:var(--fg)}
}
@media (prefers-reduced-motion:reduce){
  .rise,.pill i::after{animation:none}
  .reel,.split i{transition:none}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<div class="rules" aria-hidden="true"></div>

<div class="ui" id="ui" data-focus="">
  <header class="bar rise" style="--d:.1s">
    <a class="sig" href="/" aria-label="محمد البدر، الصفحة الرئيسية">Mohammed</a>
    <span class="pill"><i></i>مباشر</span>
  </header>

  <section class="total" aria-labelledby="t-label">
    <h1 class="eyebrow rise" id="t-label" style="--d:.25s">إجمالي التوكنز</h1>
    <div class="num big rise" id="nTotal" style="--d:.35s" role="img" aria-label="66,878,124,999 توكن">66,878,124,999</div>
    <div class="split rise" style="--d:.5s" aria-hidden="true"><i class="c" id="sC"></i><i class="g" id="sG"></i></div>
  </section>

  <div class="fill"></div>

  <section class="models" aria-label="حسب النموذج">
    <button class="model claude rise" style="--d:.6s" data-k="claude" type="button">
      <span class="lab"><i></i>Claude Code<em id="pC">92%</em></span>
      <span class="num" id="nClaude" role="img" aria-label="61,817,839,794 توكن">61,817,839,794</span>
    </button>
    <button class="model gpt rise" style="--d:.7s" data-k="gpt" type="button">
      <span class="lab"><i></i>GPT · Codex<em id="pG">8%</em></span>
      <span class="num" id="nGpt" role="img" aria-label="5,060,285,206 توكن">5,060,285,206</span>
    </button>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canHover = window.matchMedia && matchMedia('(hover: hover)').matches;
  var ui = document.getElementById('ui');

  /* ---------- numbers ---------- */
  var DATA = {
    at: Date.parse('2026-10-14T20:43:15Z'),
    claude: { total: 61817839794, perDay: 822226416 },
    gpt:    { total: 5060285206,  perDay: 292264238 }
  };
  function value(k, now){ var d = DATA[k]; return d.total + d.perDay * Math.max(0, now - DATA.at) / 864e5; }
  function fmt(v){ return Math.floor(v).toLocaleString('en-US'); }

  var REEL = 31, ROLL = 1200;
  function Counter(el){ this.el = el; this.cells = []; this.len = 0; }
  function place(cell, idx, animate, delay, dur){
    var r = cell.reel;
    if (!animate){
      r.style.transition = 'none'; r.style.transform = 'translateY(-' + idx + 'em)';
      void r.offsetHeight; r.style.transition = '';
    } else {
      r.style.transitionDelay = (delay || 0) + 'ms';
      r.style.transitionDuration = dur ? dur + 'ms' : '';
      r.style.transform = 'translateY(-' + idx + 'em)';
    }
    cell.idx = idx;
  }
  Counter.prototype.build = function(s, zero){
    this.el.textContent = ''; this.cells = []; this.len = s.length;
    for (var i = 0; i < s.length; i++){
      var c = s[i], span = document.createElement('span'), tail = i >= s.length - 7;
      span.className = (c === ',' ? 'ch sep' : 'ch') + (tail ? ' tail' : '');
      span.setAttribute('aria-hidden', 'true');
      if (c === ','){ span.textContent = ','; this.cells.push(null); }
      else {
        var reel = document.createElement('span'); reel.className = 'reel';
        for (var k = 0; k < REEL; k++){ var x = document.createElement('span'); x.textContent = k % 10; reel.appendChild(x); }
        span.appendChild(reel);
        var cell = { reel: reel, d: zero ? 0 : +c }; this.cells.push(cell);
        place(cell, 10 + cell.d, false);
      }
      this.el.appendChild(span);
    }
  };
  Counter.prototype.set = function(v, intro){
    var s = fmt(v), self = this;
    this.el.setAttribute('aria-label', s + ' توكن');
    if (s.length !== this.len){ this.build(s, intro); if (!intro) return; }
    var n = 0;
    this.cells.forEach(function(cell, i){
      if (!cell) return;
      var d = +s[i];
      if (intro){
        var delay = n++ * 55, dur = 2200;
        place(cell, 0, false);                      // forces a reflow, so the roll starts from 0 even in a background tab
        place(cell, 20 + d, true, delay, dur);
        setTimeout(function(){ place(cell, 10 + d, false); }, delay + dur + 80);
      } else if (d !== cell.d){
        if (d > cell.d) place(cell, 10 + d, true);
        else { place(cell, 20 + d, true); setTimeout(function(){ place(cell, 10 + d, false); }, ROLL + 80); }
      }
      cell.d = d;
    });
  };

  var C = {
    total: new Counter(document.getElementById('nTotal')),
    claude: new Counter(document.getElementById('nClaude')),
    gpt: new Counter(document.getElementById('nGpt'))
  };
  function render(intro){
    var now = Date.now(), c = value('claude', now), g = value('gpt', now);
    C.total.set(c + g, intro); C.claude.set(c, intro); C.gpt.set(g, intro);
  }
  function shares(){
    var now = Date.now(), c = value('claude', now), g = value('gpt', now), pc = Math.round(c / (c + g) * 100);
    document.getElementById('pC').textContent = pc + '%';
    document.getElementById('pG').textContent = (100 - pc) + '%';
    document.getElementById('sC').style.width = (c / (c + g) * 100) + '%';
    document.getElementById('sG').style.width = (g / (c + g) * 100) + '%';
  }

  // show zeros right away so the roll-in has a start, then roll once the numbers are in
  ['total', 'claude', 'gpt'].forEach(function(k){
    var v = k === 'total' ? value('claude', Date.now()) + value('gpt', Date.now()) : value(k, Date.now());
    C[k].build(fmt(v), true);
  });
  var started = false;
  function start(){
    if (started) return; started = true;
    shares(); render(!reduce);
    setInterval(function(){ render(false); }, 4000);
  }
  fetch('/api/tokens', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.claude && j.gpt){
        DATA = { at: Date.parse(j.at) || Date.now(), claude: j.claude, gpt: j.gpt };
        if (started) shares();
      }
    })
    .catch(function(){})
    .then(function(){ setTimeout(start, 250); });
  setTimeout(start, 1100);

  /* ---------- focus: hover a card, or tap a card / laptop ---------- */
  var focus = null, setSceneFocus = function(){};
  function setFocus(k){
    focus = k;
    ui.setAttribute('data-focus', k || '');
    document.querySelectorAll('.model').forEach(function(b){
      var on = b.getAttribute('data-k') === k;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    setSceneFocus(k);
  }
  document.querySelectorAll('.model').forEach(function(b){
    var k = b.getAttribute('data-k');
    b.setAttribute('aria-pressed', 'false');
    if (canHover){
      b.addEventListener('mouseenter', function(){ setFocus(k); });
      b.addEventListener('mouseleave', function(){ setFocus(null); });
    }
    b.addEventListener('click', function(){ if (!canHover) setFocus(focus === k ? null : k); });
  });

  /* ---------- constellation (same as the home hero) ---------- */
  (function(){
    var cv = document.getElementById('stars'), ctx = cv.getContext('2d'), w, h, dpr, pts = [];
    function size(){
      dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.min(70, Math.floor(w * h / 16000)); pts = [];
      for (var i = 0; i < n; i++) pts.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22 });
    }
    function draw(){
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < pts.length; i++){ var p = pts[i]; p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1; }
      for (i = 0; i < pts.length; i++) for (var j = i + 1; j < pts.length; j++){
        var a = pts[i], b = pts[j], dd = Math.hypot(a.x - b.x, a.y - b.y);
        if (dd < 130){ ctx.strokeStyle = 'rgba(243,80,15,' + (.14 * (1 - dd / 130)) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      ctx.fillStyle = 'rgba(243,80,15,.55)';
      for (i = 0; i < pts.length; i++){ ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 1.4, 0, 7); ctx.fill(); }
      if (!reduce) requestAnimationFrame(draw);
    }
    size(); addEventListener('resize', size); draw();
  })();

  /* ---------- scene ---------- */
  if (!window.THREE) return;
  var canvas = document.getElementById('gl'), renderer;
  var small = Math.min(innerWidth, innerHeight) < 600;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' }); } catch (e) { return; }
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = !small; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x000000, 10, 26);
  var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 80);

  var COL = { claude: new THREE.Color(0xf3500f), gpt: new THREE.Color(0x1ef482), orange2: new THREE.Color(0xff6a2b) };
  var matBody = new THREE.MeshStandardMaterial({ color: 0x0d0d0f, roughness: 0.36, metalness: 0.22 });
  var matDark = new THREE.MeshStandardMaterial({ color: 0x0a0a0b, roughness: 0.5, metalness: 0.3 });
  var matDesk = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.28, metalness: 0.45 });

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.5 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  var desk = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.06, 1.55), matDesk); desk.position.y = 0.95; desk.castShadow = desk.receiveShadow = true; scene.add(desk);

  function radial(stops){
    var c = document.createElement('canvas'); c.width = c.height = 256; var g = c.getContext('2d');
    var r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    stops.forEach(function(s){ r.addColorStop(s[0], s[1]); });
    g.fillStyle = r; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
  }
  var GLOW = radial([[0, 'rgba(255,255,255,1)'], [.25, 'rgba(255,255,255,.45)'], [1, 'rgba(255,255,255,0)']]);
  // the home hero card gradient, as light
  var SUN = radial([[0, 'rgba(255,122,61,.95)'], [.3, 'rgba(243,80,15,.6)'], [.66, 'rgba(125,31,6,.22)'], [1, 'rgba(22,10,5,0)']]);
  function sprite(map, color, scale, opacity){
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: map, color: color, transparent: true, opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    s.scale.set(scale, scale, 1); return s;
  }

  // laptop screens: a log that keeps writing
  function Screen(color, lines){
    var c = document.createElement('canvas'); c.width = 512; c.height = 320; this.g = c.getContext('2d');
    this.tex = new THREE.CanvasTexture(c); this.tex.encoding = THREE.sRGBEncoding;
    this.color = color; this.pool = lines; this.rows = []; this.last = 0; this.i = 0;
    for (var k = 0; k < 11; k++) this.push();
    this.draw();
  }
  Screen.prototype.push = function(){ this.rows.push(this.pool[this.i++ % this.pool.length]); if (this.rows.length > 12) this.rows.shift(); };
  Screen.prototype.draw = function(){
    var g = this.g, col = this.color;
    g.fillStyle = '#050505'; g.fillRect(0, 0, 512, 320);
    g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(0, 0, 512, 26);
    for (var d = 0; d < 3; d++){ g.globalAlpha = .8 - d * .25; g.fillStyle = col; g.beginPath(); g.arc(14 + d * 16, 13, 4, 0, 7); g.fill(); }
    g.font = '500 17px Menlo, monospace'; g.textBaseline = 'top';
    for (var i = 0; i < this.rows.length; i++){
      g.globalAlpha = i === this.rows.length - 1 ? 1 : .35 + .5 * (i / this.rows.length);
      g.fillStyle = this.rows[i].charAt(0) === '✓' ? '#ffffff' : col;
      g.fillText(this.rows[i], 16, 38 + i * 22);
    }
    var lastW = g.measureText(this.rows[this.rows.length - 1]).width;
    g.globalAlpha = 1; g.fillStyle = col; g.fillRect(22 + lastW, 40 + (this.rows.length - 1) * 22, 9, 15);
    this.tex.needsUpdate = true;
  };
  Screen.prototype.update = function(t){ if (t - this.last > 520 + Math.random() * 520){ this.last = t; this.push(); this.draw(); } };
  var screens = {
    claude: new Screen('#f3500f', ['$ claude', '> build the token meter', 'Read   public/tokens.html', 'Edit   worker.js  +14 -2', 'Bash   npm run build', '✓ compiled', 'Thinking…', 'Write  scripts/update.py', '✓ 36 pages', 'Edit   app/sitemap.ts', 'git push origin main', '✓ deployed']),
    gpt: new Screen('#1ef482', ['codex › ready', '> refactor the worker', 'reasoning  xhigh', 'apply_patch  src/api.ts', 'exec  pnpm test', '✓ 48 passed', 'computer-use · click', 'apply_patch  lib/data.ts', 'exec  pnpm build', '✓ done', 'thread · codex-app'])
  };

  function laptop(k, x, rotY){
    var g = new THREE.Group(); g.position.set(x, 0.98, -0.12); g.rotation.y = rotY; scene.add(g);
    var base = new THREE.Mesh(new THREE.BoxGeometry(1.06, 0.03, 0.72), matBody); base.castShadow = true; g.add(base);
    var keys = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 0.36), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 })); keys.rotation.x = -Math.PI / 2; keys.position.set(0, 0.016, 0.02); g.add(keys);
    var hinge = new THREE.Group(); hinge.position.set(0, 0.015, -0.36); hinge.rotation.x = -0.17; g.add(hinge);
    var lid = new THREE.Mesh(new THREE.BoxGeometry(1.06, 0.7, 0.016), matBody); lid.position.set(0, 0.35, 0); lid.castShadow = true; hinge.add(lid);
    var mat = new THREE.MeshBasicMaterial({ map: screens[k].tex, toneMapped: false });
    var scr = new THREE.Mesh(new THREE.PlaneGeometry(0.96, 0.6), mat); scr.position.set(0, 0.36, 0.0095); hinge.add(scr);
    var light = new THREE.PointLight(COL[k], 0, 4.6, 2); light.position.set(0, 0.5, 0.55); hinge.add(light);
    var glow = sprite(GLOW, COL[k], 1.9, 0); glow.position.set(0, 0.36, 0.06); hinge.add(glow);
    return { group: g, mat: mat, light: light, glow: glow, level: 1 };
  }
  var lap = { claude: laptop('claude', -1.22, 0.42), gpt: laptop('gpt', 1.22, -0.42) };

  // seated figure, from behind
  function tube(a, b, r0, r1){
    var d = new THREE.Vector3().subVectors(b, a), len = d.length();
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 20), matBody);
    m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); m.castShadow = true; return m;
  }
  var fig = new THREE.Group(); fig.position.set(0, 0, 0.55); scene.add(fig);
  var torso = new THREE.Mesh(new THREE.LatheGeometry([
    new THREE.Vector2(.14, 0), new THREE.Vector2(.3, .08), new THREE.Vector2(.33, .4), new THREE.Vector2(.37, .64),
    new THREE.Vector2(.36, .74), new THREE.Vector2(.22, .82), new THREE.Vector2(.1, .86), new THREE.Vector2(.085, .92)
  ], 48), matBody);
  torso.position.y = 1.0; torso.scale.set(1.1, 1, .78); torso.castShadow = true; fig.add(torso);
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(.075, .085, .14, 20), matBody); neck.position.y = 1.9; fig.add(neck);
  var head = new THREE.Group(); head.position.set(0, 2.03, 0); fig.add(head);
  var skull = new THREE.Mesh(new THREE.SphereGeometry(.2, 48, 36), matBody); skull.scale.set(.92, 1.08, 1); skull.castShadow = true; head.add(skull);
  var band = new THREE.Mesh(new THREE.TorusGeometry(.205, .016, 12, 60, Math.PI), matDark); band.position.y = .02; head.add(band);
  [-1, 1].forEach(function(s){ var cup = new THREE.Mesh(new THREE.CylinderGeometry(.062, .062, .036, 28), matDark); cup.rotation.z = Math.PI / 2; cup.position.set(s * .205, -.02, 0); head.add(cup); });
  [-1, 1].forEach(function(s){
    var sh = new THREE.Vector3(s * .37, 1.72, 0), el = new THREE.Vector3(s * .48, 1.38, -.3), hd = new THREE.Vector3(s * .6, 1.04, -.68);
    fig.add(tube(sh, el, .085, .07)); fig.add(tube(el, hd, .07, .055));
    var joint = new THREE.Mesh(new THREE.SphereGeometry(.07, 20, 16), matBody); joint.position.copy(el); fig.add(joint);
    var hand = new THREE.Mesh(new THREE.SphereGeometry(.065, 20, 16), matBody); hand.position.copy(hd); hand.scale.set(1, .6, 1.3); fig.add(hand);
  });
  var chairBack = new THREE.Mesh(new THREE.BoxGeometry(.7, .34, .06), matDark); chairBack.position.set(0, 1.12, .3); chairBack.castShadow = true; fig.add(chairBack);

  // the orange halo: the hero card's gradient as a sun, with a ring that draws itself in
  var HALO_Y = 1.86, R = 1.02;
  var halo = new THREE.Group(); halo.position.set(0, HALO_Y, -1.6); scene.add(halo);
  var sun = sprite(SUN, 0xffffff, 6.4, 0); halo.add(sun);
  var ringMat = new THREE.MeshBasicMaterial({ color: COL.orange2, toneMapped: false });
  var ringGlowMat = new THREE.MeshBasicMaterial({ color: COL.claude, transparent: true, opacity: .28, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  var ring = new THREE.Mesh(new THREE.TorusGeometry(R, .013, 10, 200, .001), ringMat); ring.rotation.z = Math.PI / 2; halo.add(ring);
  var ringGlow = new THREE.Mesh(new THREE.TorusGeometry(R, .055, 10, 200, .001), ringGlowMat); ringGlow.rotation.z = Math.PI / 2; halo.add(ringGlow);
  var arcNow = 0;
  function setArc(a){
    if (Math.abs(a - arcNow) < .002) return; arcNow = a;
    ring.geometry.dispose(); ring.geometry = new THREE.TorusGeometry(R, .013, 10, 200, Math.max(a, .001));
    ringGlow.geometry.dispose(); ringGlow.geometry = new THREE.TorusGeometry(R, .055, 10, 200, Math.max(a, .001));
  }

  // lights
  scene.add(new THREE.AmbientLight(0x1c1410, .75));
  var key = new THREE.SpotLight(0xffe2d0, .45, 22, .6, .7, 1.5); key.position.set(0, 6, 5); key.castShadow = !small; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0005; scene.add(key);
  var rims = [-1, 1].map(function(s){ var l = new THREE.PointLight(COL.claude, 0, 4.2, 2); l.position.set(s * .85, 2.15, -.35); scene.add(l); return l; });
  var fill = new THREE.PointLight(0xffc6a8, .22, 12, 2); fill.position.set(0, 2.6, 6); scene.add(fill);

  // tokens rising off the screens
  var N = small ? 110 : 170, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), vel = new Float32Array(N), seed = new Float32Array(N);
  function resetP(i, init){
    var left = i % 2 === 0, c = left ? COL.claude : COL.gpt;
    pos[i * 3] = (left ? -1.22 : 1.22) + (Math.random() - .5) * .8;
    pos[i * 3 + 1] = 1.25 + (init ? Math.random() * 2 : Math.random() * .25);
    pos[i * 3 + 2] = -.32 + (Math.random() - .5) * .4;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    vel[i] = .05 + Math.random() * .11; seed[i] = Math.random() * 6.28;
  }
  for (var i = 0; i < N; i++) resetP(i, true);
  var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); pg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var pmat = new THREE.PointsMaterial({ size: .04, map: GLOW, vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  scene.add(new THREE.Points(pg, pmat));

  /* ---------- framing: keep the scene inside the free band between the total and the cards ---------- */
  var totalEl = document.querySelector('.total'), modelsEl = document.querySelector('.models');
  var base = { dist: 9, lookY: 1.8 }, mobile = false;
  function layout(){
    var w = innerWidth, h = innerHeight, a = w / h; mobile = w < 761 || a < .8;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.6 : 1.8));
    renderer.setSize(w, h, false); camera.aspect = a; camera.updateProjectionMatrix();
    var t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var top = totalEl.getBoundingClientRect().bottom + 12, bot = modelsEl.getBoundingClientRect().top - 8;
    var band = Math.max(160, bot - top);
    var dist = Math.max(mobile ? 1.72 : 2.45, 0) / (t * a);                // fit the desk's width
    dist = Math.max(dist, 2.55 * h / (band * 2 * t));                       // fit the scene's height in the band
    dist = Math.max(dist, 7.4);
    var upp = 2 * dist * t / h;                                            // world units per css px
    base.dist = dist; base.lookY = 1.86 + ((top + bot) / 2 - h / 2) * upp;
  }
  layout(); addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  var target = { x: 0, lookX: 0, yaw: 0, L: 1, Rg: 1 }, cur = { x: 0, lookX: 0, yaw: 0, L: 1, Rg: 1, camY: 0, lookY: 0, dist: 0 };
  setSceneFocus = function(k){
    var m = mobile ? .55 : 1;
    target.x = k === 'claude' ? -1.3 * m : k === 'gpt' ? 1.3 * m : 0;
    target.lookX = k === 'claude' ? -.4 * m : k === 'gpt' ? .4 * m : 0;
    target.yaw = k === 'claude' ? .55 : k === 'gpt' ? -.55 : 0;
    target.L = k === 'gpt' ? .3 : k === 'claude' ? 1.5 : 1;
    target.Rg = k === 'claude' ? .3 : k === 'gpt' ? 1.5 : 1;
  };

  // tap a laptop to focus it
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function hit(e){
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    var h = ray.intersectObjects([lap.claude.group, lap.gpt.group], true)[0]; if (!h) return null;
    var o = h.object; while (o && o !== lap.claude.group && o !== lap.gpt.group) o = o.parent;
    return o === lap.claude.group ? 'claude' : 'gpt';
  }
  canvas.addEventListener('click', function(e){ var k = hit(e); setFocus(k && focus !== k ? k : null); });
  var mouse = { x: 0, y: 0 };
  addEventListener('pointermove', function(e){
    if (e.pointerType !== 'mouse') return;
    mouse.x = (e.clientX / innerWidth - .5) * 2; mouse.y = (e.clientY / innerHeight - .5) * 2;
    if (e.target === canvas) canvas.style.cursor = hit(e) ? 'pointer' : '';
  }, { passive: true });

  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(v){ return 1 - Math.pow(1 - v, 3); }
  function flicker(t, s){ if (t < s) return 0; var u = (t - s) / 520; return u >= 1 ? 1 : u < .2 ? .7 : u < .35 ? .08 : u < .55 ? .85 : u < .68 ? .25 : 1; }

  var T0 = performance.now(), lastT = T0, tmp = new THREE.Vector3(), first = true;
  function frame(now){
    requestAnimationFrame(frame);
    var t = reduce ? 1e5 : now - T0, dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
    var k = first ? 1 : 1 - Math.pow(.002, dt); first = false;

    // intro: sun rises, ring draws, screens switch on
    var ringP = ease(clamp((t - 250) / 1500));
    setArc(ringP * Math.PI * 2);
    sun.material.opacity = .5 * ease(clamp((t - 80) / 1800));
    var pL = flicker(t, 1000), pR = flicker(t, 1300);
    pmat.opacity = .8 * ease(clamp((t - 1500) / 1200));
    rims.forEach(function(l){ l.intensity = 3.2 * ringP; });

    ['x', 'lookX', 'yaw', 'L', 'Rg'].forEach(function(p){ cur[p] += (target[p] - cur[p]) * k; });
    cur.dist += (base.dist - cur.dist) * k; cur.lookY += (base.lookY - cur.lookY) * k;
    var sway = reduce ? 0 : Math.sin(now * .00032) * (mobile ? .08 : .16);
    tmp.set(cur.x + mouse.x * .3 + sway, cur.lookY + .6 - mouse.y * .12, cur.dist);
    camera.position.copy(tmp);
    tmp.set(cur.lookX, cur.lookY, 0); camera.lookAt(tmp);

    head.rotation.y = cur.yaw + (reduce ? 0 : Math.sin(now * .0006) * .07);
    head.rotation.x = .1 + (reduce ? 0 : Math.sin(now * .001) * .025);
    torso.rotation.y = cur.yaw * .22;

    lap.claude.mat.color.setScalar(pL * Math.min(1, .55 + cur.L * .45));
    lap.gpt.mat.color.setScalar(pR * Math.min(1, .55 + cur.Rg * .45));
    lap.claude.light.intensity = 2.3 * pL * cur.L; lap.claude.glow.material.opacity = .3 * pL * cur.L;
    lap.gpt.light.intensity = 2.3 * pR * cur.Rg; lap.gpt.glow.material.opacity = .3 * pR * cur.Rg;
    if (pL > 0) screens.claude.update(now);
    if (pR > 0) screens.gpt.update(now);

    if (!reduce){
      for (var i = 0; i < N; i++){
        pos[i * 3 + 1] += vel[i] * dt; pos[i * 3] += Math.sin(now * .0008 + seed[i]) * .0012;
        if (pos[i * 3 + 1] > 3.3) resetP(i, false);
      }
      pg.attributes.position.needsUpdate = true;
    }
    renderer.render(scene, camera);
  }
  cur.dist = base.dist; cur.lookY = base.lookY;
  requestAnimationFrame(frame);
})();
</script>
