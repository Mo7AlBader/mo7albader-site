<style>
/* Layout: a scroll film. One fixed WebGL set (figure, two laptops, orange halo) under four sticky chapters; GSAP ScrollTrigger drives the camera between them. mo7albader identity: black, orange, mint, Rajdhani numerals, framed column. */
:root{
  --bg:#000; --surface:#111; --accent:#f3500f; --accent-2:#ff6a2b; --mint:#1ef482;
  --fg:#fff; --soft:rgba(255,255,255,.86); --muted:rgba(255,255,255,.6); --faint:#666; --line:rgba(255,255,255,.1);
  --glass:inset 0 1px 10px rgba(255,255,255,.1);
  --display:"Rajdhani",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sig:"Waterfall",cursive;
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(20px,5vw,48px);
  --top:calc(76px + env(safe-area-inset-top,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--ar);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
a{color:inherit}

#stars,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#stars{z-index:0}
#gl{z-index:1}
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.72) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 72%,rgba(0,0,0,.7) 100%)}
.rules{position:fixed;inset:0;z-index:2;pointer-events:none;max-width:850px;margin-inline:auto;box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line)}
.rules::before,.rules::after{content:"";position:absolute;top:var(--top);width:6px;height:6px;background:var(--faint)}
.rules::before{left:-3px}.rules::after{right:-3px}
.track{position:fixed;right:18px;top:50%;z-index:5;width:2px;height:120px;margin-top:-60px;border-radius:2px;background:var(--line);overflow:hidden;pointer-events:none}
.track i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:top;transform:scaleY(0);box-shadow:0 0 10px var(--accent)}

.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:var(--top);padding:env(safe-area-inset-top,0px) var(--gut) 0;pointer-events:none}
.bar a,.bar span{pointer-events:auto}
.sig{font-family:var(--sig);font-size:40px;line-height:1;text-decoration:none;direction:ltr;padding-top:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.pill i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--mint);animation:ping 2.4s var(--ease) infinite}

.story{position:relative;z-index:3;overflow-x:clip}
.chapter{position:relative;height:175vh}
.chapter.hero{height:125vh}
.chapter.finale{height:160vh}
.pin{position:sticky;top:0;height:100vh;height:100svh;max-width:1180px;margin-inline:auto;padding-inline:var(--gut);display:flex;pointer-events:none}
.pin a,.pin button{pointer-events:auto}
.copy{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:18px;max-width:560px;text-shadow:0 2px 30px rgba(0,0,0,.8)}
.copy::before{content:"";position:absolute;inset:-28% -18%;z-index:-1;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
.copy .num{text-shadow:none}

.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 10px var(--c,var(--accent))}
.eyebrow em{font-style:normal;font-family:var(--display);font-weight:600;font-size:15px;color:var(--c,var(--accent))}
.line{margin:0;font-size:clamp(19px,2vw,26px);font-weight:500;line-height:1.5;color:var(--soft);text-wrap:balance}

.num{display:inline-flex;direction:ltr;font-family:var(--display);font-weight:700;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.num.xl{font-size:clamp(40px,12.4vw,128px)}
.num.lg{font-size:clamp(44px,7.2vw,104px)}
.ch{display:inline-block;width:.54em;height:1em;overflow:hidden;text-align:center}
.ch.sep{width:.22em}
.reel{display:flex;flex-direction:column;transition:transform 1.2s var(--ease);will-change:transform}
.reel span{display:block;height:1em;line-height:1}
.tail{opacity:.38}

.split{display:flex;direction:ltr;width:min(100%,460px);height:3px;gap:3px}
.split i{display:block;height:100%;width:0;border-radius:3px;transition:width 2s var(--ease) .5s}
.split .c{background:var(--accent)}
.split .g{background:var(--mint)}

/* hero */
.hero .pin{flex-direction:column;align-items:center;padding-top:calc(var(--top) + 5vh)}
.hero .copy{align-items:center;text-align:center;max-width:none}
.cue{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.cue i{position:relative;width:1px;height:46px;background:var(--line);overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--accent);animation:drip 1.8s var(--ease) infinite}

/* model chapters: copy sits opposite the laptop the camera is on */
.claude{--c:var(--accent)}
.gpt{--c:var(--mint)}
/* the copy sits above the laptop in focus, clear of the person */
.claude .pin{align-items:flex-start;justify-content:flex-end;padding-top:calc(var(--top) + 7vh)}
.gpt .pin{align-items:flex-start;justify-content:flex-start;padding-top:calc(var(--top) + 7vh)}

/* finale */
.finale .pin{flex-direction:column;align-items:center;justify-content:space-between;padding-block:calc(var(--top) + 4vh) calc(30px + env(safe-area-inset-bottom,0px))}
.finale .copy{align-items:center;text-align:center;max-width:none}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font:500 15px var(--ar);text-decoration:none;transition:transform .4s var(--ease),background .3s,border-color .3s}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 18px 50px -18px var(--accent)}
.btn.primary:hover{background:var(--accent-2);transform:translateY(-2px)}
.btn.ghost{border:1px solid var(--line);background:rgba(17,17,17,.55);box-shadow:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn.ghost:hover{border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.btn svg{width:18px;height:18px}

@keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes drip{0%{top:-40%}100%{top:100%}}
.rise{animation:rise 1s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media (max-width:760px),(max-aspect-ratio:9/10){
  .rules,.track{display:none}
  .sig{font-size:34px}
  .pill{font-size:13px;padding:5px 12px}
  .claude .pin,.gpt .pin{align-items:flex-start;justify-content:center;padding-top:calc(var(--top) + 4vh)}
  .claude .copy,.gpt .copy{align-items:center;text-align:center}
  .num.lg{font-size:clamp(40px,11.6vw,72px)}
  .split{width:min(100%,280px)}
  .copy{gap:14px}
  .btn{height:48px;padding:0 20px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .rise,.pill i::after,.cue i::after{animation:none}
  .reel,.split i{transition:none}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MOBILE_Q = '(max-width: 760px), (max-aspect-ratio: 9/10)';
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  /* ---------- numbers ---------- */
  var DATA = {
    at: Date.parse('2026-10-14T20:43:15Z'),
    claude: { total: 61817839794, perDay: 822226416 },
    gpt:    { total: 5060285206,  perDay: 292264238 }
  };
  function value(k, now){
    if (k === 'total' || k === 'total2') return value('claude', now) + value('gpt', now);
    var d = DATA[k]; return d.total + d.perDay * Math.max(0, now - DATA.at) / 864e5;
  }
  function fmt(v){ return Math.floor(v).toLocaleString('en-US'); }

  var REEL = 31, ROLL = 1200;
  function place(cell, idx, animate, delay, dur){
    var r = cell.reel;
    if (!animate){ r.style.transition = 'none'; r.style.transform = 'translateY(-' + idx + 'em)'; void r.offsetHeight; r.style.transition = ''; }
    else { r.style.transitionDelay = (delay || 0) + 'ms'; r.style.transitionDuration = dur ? dur + 'ms' : ''; r.style.transform = 'translateY(-' + idx + 'em)'; }
  }
  function Counter(el){ this.el = el; this.cells = []; this.len = 0; this.live = false; }
  Counter.prototype.build = function(s, zero){
    this.el.textContent = ''; this.cells = []; this.len = s.length;
    for (var i = 0; i < s.length; i++){
      var c = s[i], span = document.createElement('span');
      span.className = (c === ',' ? 'ch sep' : 'ch') + (i >= s.length - 7 ? ' tail' : '');
      span.setAttribute('aria-hidden', 'true');
      if (c === ','){ span.textContent = ','; this.cells.push(null); }
      else {
        var reel = document.createElement('span'); reel.className = 'reel';
        for (var k = 0; k < REEL; k++){ var x = document.createElement('span'); x.textContent = k % 10; reel.appendChild(x); }
        span.appendChild(reel);
        var cell = { reel: reel, d: zero ? 0 : +c }; this.cells.push(cell); place(cell, 10 + cell.d, false);
      }
      this.el.appendChild(span);
    }
  };
  Counter.prototype.set = function(v, intro){
    var s = fmt(v), n = 0;
    this.el.setAttribute('aria-label', s + ' توكن');
    if (s.length !== this.len){ this.build(s, intro); if (!intro) return; }
    this.cells.forEach(function(cell, i){
      if (!cell) return;
      var d = +s[i];
      if (intro){
        var delay = n++ * 55, dur = 2200;
        place(cell, 0, false); place(cell, 20 + d, true, delay, dur);
        setTimeout(function(){ place(cell, 10 + d, false); }, delay + dur + 80);
      } else if (d !== cell.d){
        if (d > cell.d) place(cell, 10 + d, true);
        else { place(cell, 20 + d, true); setTimeout(function(){ place(cell, 10 + d, false); }, ROLL + 80); }
      }
      cell.d = d;
    });
  };

  var CNT = {};
  [['total', 'nTotal'], ['claude', 'nClaude'], ['gpt', 'nGpt'], ['total2', 'nTotal2']].forEach(function(p){
    CNT[p[0]] = new Counter(document.getElementById(p[1]));
    CNT[p[0]].build(fmt(value(p[0], Date.now())), true);
  });
  function roll(k){ var c = CNT[k]; if (c.live) return; c.live = true; c.set(value(k, Date.now()), !reduce); }
  function shares(){
    var now = Date.now(), c = value('claude', now), g = value('gpt', now), pc = c / (c + g) * 100;
    document.querySelectorAll('.share-c').forEach(function(e){ e.textContent = Math.round(pc) + '%'; });
    document.querySelectorAll('.share-g').forEach(function(e){ e.textContent = (100 - Math.round(pc)) + '%'; });
    document.querySelectorAll('.split').forEach(function(s){ s.children[0].style.width = pc + '%'; s.children[1].style.width = (100 - pc) + '%'; });
  }
  var started = false;
  function start(){
    if (started) return; started = true;
    shares(); roll('total');
    setInterval(function(){ var now = Date.now(); Object.keys(CNT).forEach(function(k){ if (CNT[k].live) CNT[k].set(value(k, now), false); }); }, 4000);
  }
  fetch('/api/tokens', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.claude && j.gpt){ DATA = { at: Date.parse(j.at) || Date.now(), claude: j.claude, gpt: j.gpt }; if (started) shares(); } })
    .catch(function(){})
    .then(function(){ setTimeout(start, 250); });
  setTimeout(start, 1100);

  document.querySelectorAll('[data-cta]').forEach(function(a){
    a.addEventListener('click', function(){
      var label = a.getAttribute('data-cta');
      try { window.gtag && gtag('event', 'tokens_cta', { label: label }); } catch (e) {}
      try { navigator.sendBeacon('/api/track', new Blob([JSON.stringify({ name: 'tokens_cta', props: { label: label } })], { type: 'application/json' })); } catch (e) {}
    });
  });

  /* ---------- constellation, as on the home hero ---------- */
  (function(){
    var cv = document.getElementById('stars'), ctx = cv.getContext('2d'), w, h, pts = [];
    function size(){
      var dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.min(70, Math.floor(w * h / 16000)); pts = [];
      for (var i = 0; i < n; i++) pts.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22 });
    }
    function draw(){
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < pts.length; i++){ var p = pts[i]; p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1; }
      for (i = 0; i < pts.length; i++) for (var j = i + 1; j < pts.length; j++){
        var a = pts[i], b = pts[j], dd = Math.hypot(a.x - b.x, a.y - b.y);
        if (dd < 130){ ctx.strokeStyle = 'rgba(243,80,15,' + (.14 * (1 - dd / 130)) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      ctx.fillStyle = 'rgba(243,80,15,.55)';
      for (i = 0; i < pts.length; i++){ ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 1.4, 0, 7); ctx.fill(); }
      if (!reduce) requestAnimationFrame(draw);
    }
    var lastW = 0; size(); draw();
    addEventListener('resize', function(){ if (innerWidth !== lastW){ lastW = innerWidth; size(); } });
  })();

  /* ---------- camera rig: GSAP tweens these, the render loop reads them ---------- */
  // cam/look in world units; sx/sy push the subject off-centre (fraction of the viewport); L/Rg = laptop light; swirl = tokens gather into the halo
  var KD = [
    { cx: 0,    cy: 2.45, cz: 8.8, lx: 0,     ly: 1.75, lz: 0,    sx: 0,    sy: .13, yaw: 0,    L: 1,   Rg: 1,   sun: 1,    swirl: 0, ringS: 1 },
    { cx: -1.05, cy: 2.0, cz: 3.05, lx: -1.22, ly: 1.32, lz: -.28, sx: -.1, sy: .16, yaw: .62,  L: 1.8, Rg: .2,  sun: .55,  swirl: 0, ringS: 1 },
    { cx: 1.05,  cy: 2.0, cz: 3.05, lx: 1.22,  ly: 1.32, lz: -.28, sx: .1,  sy: .16, yaw: -.62, L: .2,  Rg: 1.8, sun: .55,  swirl: 0, ringS: 1 },
    { cx: 0,    cy: 3.1,  cz: 12.6, lx: 0,     ly: 1.9, lz: -.6,  sx: 0,    sy: .04, yaw: 0,    L: .9,  Rg: .9,  sun: 1.35, swirl: 1, ringS: 1.14 }
  ];
  var KM = [
    { cx: 0,    cy: 2.6,  cz: 10.8, lx: 0,     ly: 1.8, lz: 0,    sx: 0, sy: .15, yaw: 0,    L: 1,   Rg: 1,   sun: 1,    swirl: 0, ringS: 1 },
    { cx: -.3,  cy: 1.85, cz: 2.75, lx: -1.25, ly: 1.3, lz: -.28, sx: 0, sy: .19, yaw: .62,  L: 1.8, Rg: .2,  sun: .55,  swirl: 0, ringS: 1 },
    { cx: .3,   cy: 1.85, cz: 2.75, lx: 1.25,  ly: 1.3, lz: -.28, sx: 0, sy: .19, yaw: -.62, L: .2,  Rg: 1.8, sun: .55,  swirl: 0, ringS: 1 },
    { cx: 0,    cy: 3.2,  cz: 14.2, lx: 0,     ly: 1.9, lz: -.6,  sx: 0, sy: .02, yaw: 0,    L: .9,  Rg: .9,  sun: 1.35, swirl: 1, ringS: 1.14 }
  ];
  var mobile = matchMedia(MOBILE_Q).matches;

  var screens = {
    claude: new Screen('#f3500f', 'claude', ['$ claude', '> build the token meter', 'Read   public/tokens.html', 'Edit   worker.js  +14 -2', 'Bash   npm run build', '✓ compiled', 'Thinking…', 'Write  scripts/update.py', '✓ 36 pages', 'Edit   app/sitemap.ts', 'git push origin main', '✓ deployed']),

  };

  function laptop(k, x, rotY){
    var g = new THREE.Group(); g.position.set(x, .98, -.12); g.rotation.y = rotY; scene.add(g);
    var base = new THREE.Mesh(new THREE.BoxGeometry(1.06, .03, .72), matBody); base.castShadow = true; g.add(base);

  var lap = { claude: laptop('claude', -1.22, .42), gpt: laptop('gpt', 1.22, -.42) };

  // seated figure, from behind
  function tube(a, b, r0, r1){
    var d = new THREE.Vector3().subVectors(b, a), len = d.length();
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 20), matBody);

  }

  var torso = new THREE.Mesh(new THREE.LatheGeometry([
    new THREE.Vector2(.14, 0), new THREE.Vector2(.3, .08), new THREE.Vector2(.33, .4), new THREE.Vector2(.37, .64),
    new THREE.Vector2(.36, .74), new THREE.Vector2(.22, .82), new THREE.Vector2(.1, .86), new THREE.Vector2(.085, .92)
  ], 48), matBody);
  torso.position.y = 1; torso.scale.set(1.1, 1, .78); torso.castShadow = true; fig.add(torso);
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(.075, .085, .14, 20), matBody); neck.position.y = 1.9; fig.add(neck);

  var band = new THREE.Mesh(new THREE.TorusGeometry(.205, .016, 12, 60, Math.PI), matDark); band.position.y = .02; head.add(band);
  [[-1, COL.claude], [1, COL.gpt]].forEach(function(p){

    var sh = new THREE.Vector3(s * .37, 1.72, 0), el = new THREE.Vector3(s * .48, 1.38, -.3), hd = new THREE.Vector3(s * .6, 1.04, -.68);

    var joint = new THREE.Mesh(new THREE.SphereGeometry(.07, 20, 16), matBody); joint.position.copy(el); fig.add(joint);

  });

  // the orange halo: the home hero gradient as a sun, and a ring that draws itself in
  var HALO_Y = 1.86, HALO_Z = -1.6, R = 1.02;

  var arcNow = 0;
  function setArc(a){

  var N = small ? 180 : 320, P = [], pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
